
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Snacks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">
        <h1>🍿 Calculadora de Snacks</h1>

        <p>Calculá cuántos snacks vas a consumir durante el resto de tu vida.</p>

        <label>¿Cuántos años tenés?</label>
        <input type="number" id="edadActual" placeholder="Ej: 17">

        <label>¿Hasta qué edad estimás que vas a vivir?</label>
        <input type="number" id="edadMaxima" placeholder="Ej: 85">

        <label>¿Cuál es tu snack favorito?</label>
        <input type="text" id="snack" placeholder="Ej: Papas fritas">

        <label>¿Cuántos snacks comés por día?</label>
        <input type="number" id="snacksPorDia" placeholder="Ej: 2">

        <label>¿Cuánto cuesta cada snack? ($)</label>
        <input type="number" id="precioPorSnack" placeholder="Ej: 1500">

        <button onclick="calcularSnacks()">Calcular</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
